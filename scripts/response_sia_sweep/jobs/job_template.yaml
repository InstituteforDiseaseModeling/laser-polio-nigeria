apiVersion: batch/v1
kind: Job
metadata:
  name: {{JOB_NAME}}
  labels:
    app: laser-polio
    component: response-sia-sweep
    detection-time: "{{DETECTION_TIME}}"
    replicate: "{{REP}}"
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        job-name: {{JOB_NAME}}
        app: laser-polio
        component: response-sia-sweep
    spec:
      restartPolicy: Never
      # Use the same node selector as working v3 script
      nodeSelector:
        nodepool: 128gb
      # Add tolerations for dedicated high-memory nodes
      tolerations:
      - key: nodepool
        operator: Equal
        value: 128gb
        effect: NoSchedule
      # Add image pull secrets (same as v3 script)
      imagePullSecrets:
      - name: idmodregcred3
      - name: registry4idm
      containers:
      - name: response-sia-job
        image: {{IMAGE}}
        args:
        - "--config={{CONFIG_PATH}}"
        - "--detection_time={{DETECTION_TIME}}"
        - "--rep={{REP}}"
        - "--output_dir=/shared/results"
        # Use /shared mount path (same as v3 script)
        volumeMounts:
        - name: shared
          mountPath: /shared
        # Add resource requests (important for scheduling)
        resources:
          requests:
            memory: 32G
            cpu: 8
          limits:
            memory: 32G
            cpu: 8
        # Environment variables (same as v3 script)
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: JOB_NAME
          value: {{JOB_NAME}}
        - name: RUN_ID
          value: {{RUN_ID}}
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
      # Use existing laser-stg-pvc (5TB capacity)
      volumes:
      - name: shared
        persistentVolumeClaim:
          claimName: laser-stg-pvc
