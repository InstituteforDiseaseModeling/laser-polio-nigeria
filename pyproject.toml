[project]
name = "laser-polio-nigeria"
version = "0.1.0"
description = "Nigeria-specific modeling, scenarios, and analysis for LASER-POLIO"
authors = [{ name = "Your Name", email = "you@example.com" }]
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "laser-polio[viz]>=0.3.0",
    "laser-polio-calibration>=0.1.0",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "geopandas",
    "pyyaml",
    "sciris",
    "click",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-xdist",  # parallel test execution with -n auto
    "kaleido<1.0",   # Plotly static image export — pin <1.0 to avoid Chrome dependency
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
addopts = "-m 'not slow'"  # skip slow tests by default

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
