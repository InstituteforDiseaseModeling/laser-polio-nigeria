[project]
name = "laser-polio-nigeria"
version = "0.1.0"
description = "Nigeria-specific modeling, scenarios, and analysis for LASER-POLIO"
authors = [{ name = "Your Name", email = "you@example.com" }]
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "laser-polio>=0.1.0",  # make sure this is versioned and installable
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
data = [
    "h5py",
    "tables",
    "geopandas",
    "pyyaml",
    "dvc",         # optional — for data versioning, if used
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
