name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  manifest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install minimal deps
        # Just enough to import laser_polio_nigeria.manifest. We deliberately do
        # NOT install lpn's full dependency tree here (no `pip install -e .`),
        # because the broader test suite needs nigeria_polio_data hydrated and
        # this workflow is scoped only to tests/test_manifest.py.
        run: python -m pip install --upgrade 'laser-polio>=0.3.0' 'pytest>=8'

      - name: Run manifest tests
        run: PYTHONPATH=src python -m pytest tests/test_manifest.py -v
