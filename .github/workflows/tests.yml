name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  manifest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pytest
        # laser_polio_nigeria.manifest is intentionally self-contained — it has
        # no runtime dependency on laser_polio, so a user with just a folder of
        # data files can use it without any other LASER package installed. We
        # only need pytest here.
        run: python -m pip install --upgrade 'pytest>=8'

      - name: Run manifest tests
        run: PYTHONPATH=src python -m pytest tests/test_manifest.py -v
